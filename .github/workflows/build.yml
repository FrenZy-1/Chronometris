name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ───────────────────────── WINDOWS ─────────────────────────
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.4.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtmultimedia'
          cache: true   # caches Qt download, saves ~5 min on reruns

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy with windeployqt
        shell: cmd
        run: |
          mkdir deploy
          # CMakeLists sets RUNTIME_OUTPUT_DIRECTORY to ${CMAKE_BINARY_DIR}/bin
          # MSVC multi-config appends Release → build\bin\Release\
          copy build\bin\Release\Chronometris.exe deploy\
          windeployqt --release --no-translations --qmldir . deploy\Chronometris.exe
          xcopy /E /I /Y assets deploy\assets

      - uses: actions/upload-artifact@v4
        with:
          name: Chronometris-Windows
          path: deploy/

  # ───────────────────────── macOS ─────────────────────────
  build-macos:
    runs-on: macos-13
    timeout-minutes: 60   # kill it if the runner queues too long
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.4.2'
          host: 'mac'
          target: 'desktop'
          modules: 'qtmultimedia'
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package .dmg
        # Single call with both flags — calling macdeployqt twice causes issues
        run: macdeployqt build/Chronometris.app -qmldir=. -always-overwrite -dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Chronometris-macOS
          path: build/Chronometris.dmg

  # ───────────────────────── ANDROID ─────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5   # v4 is deprecated
        with:
          java-version: '17'
          distribution: 'temurin'

      # Install host Qt FIRST and save QTDIR before the Android install overwrites it
      - name: Install host Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.4.2'
          host: 'linux'
          target: 'desktop'
          dir: '/opt/Qt-host'
          cache: true

      - name: Save host Qt path
        # jurplel sets QTDIR for this install; capture it before the next install overwrites it
        run: echo "QT_HOST_DIR=$QTDIR" >> $GITHUB_ENV

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.4.2'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtmultimedia'
          cache: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_PREFIX_PATH=$QTDIR \
            -DQT_HOST_PATH=${{ env.QT_HOST_DIR }} \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Build APK
        run: |
          cd build/android-build
          chmod +x gradlew
          ./gradlew assembleDebug   # Debug = no signing required; change to assembleRelease + signing config for distribution

      - uses: actions/upload-artifact@v4
        with:
          name: Chronometris-Android
          path: build/android-build/build/outputs/apk/debug/*.apk
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ───────────────────────── WINDOWS ─────────────────────────
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.4.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtmultimedia'
          cache: true   # caches Qt download, saves ~5 min on reruns

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy with windeployqt
        shell: cmd
        run: |
          mkdir deploy
          # CMakeLists sets RUNTIME_OUTPUT_DIRECTORY to ${CMAKE_BINARY_DIR}/bin
          # MSVC multi-config appends Release → build\bin\Release\
          copy build\bin\Release\Chronometris.exe deploy\
          windeployqt --release --no-translations --qmldir . deploy\Chronometris.exe
          xcopy /E /I /Y assets deploy\assets

      - uses: actions/upload-artifact@v4
        with:
          name: Chronometris-Windows
          path: deploy/

  # ───────────────────────── macOS ─────────────────────────
  build-macos:
    runs-on: macos-14
    timeout-minutes: 10   # kill it if the runner queues too long
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.4.2'
          host: 'mac'
          target: 'desktop'
          modules: 'qtmultimedia'
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package .dmg
        # Single call with both flags — calling macdeployqt twice causes issues
        run: macdeployqt build/bin/Chronometris.app -qmldir=. -always-overwrite -dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Chronometris-macOS
          path: build/bin/Chronometris.dmg